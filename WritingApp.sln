Microsoft Visual Studio Solution File, Format Version 12.00
# Visual Studio Version 17
VisualStudioVersion = 17.0.31903.59
MinimumVisualStudioVersion = 10.0.40219.1

# =============================================================================
# SOLUTION FILE EXPLANATION
# =============================================================================
# This .sln file is a Visual Studio Solution file that organizes our .NET project.
# Think of it as a "container" that holds one or more related projects.
# 
# In our case, we have one project: WritingApp (our terminal writing application)
# 
# The solution file tells Visual Studio and the .NET CLI:
# 1. What projects are in this solution
# 2. How to build them (Debug vs Release configurations)
# 3. Project dependencies and relationships
# =============================================================================

# This line defines our WritingApp project:
# - "WritingApp" = Display name
# - "WritingApp\WritingApp.csproj" = Path to the project file
# - "{A1B2C3D4-E5F6-7890-ABCD-EF1234567890}" = Unique GUID identifier
# - FAE04EC0-301F-11D3-BF4B-00C04F79EFBC = C# project type identifier
Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "WritingApp", "WritingApp\WritingApp.csproj", "{A1B2C3D4-E5F6-7890-ABCD-EF1234567890}"
EndProject

Global
	# =============================================================================
	# SOLUTION CONFIGURATIONS
	# =============================================================================
	# Defines the build configurations available for the entire solution
	# Debug = Development build with debugging information
	# Release = Production build optimized for performance
	GlobalSection(SolutionConfigurationPlatforms) = preSolution
		Debug|Any CPU = Debug|Any CPU
		Release|Any CPU = Release|Any CPU
	EndGlobalSection
	
	# =============================================================================
	# PROJECT CONFIGURATIONS
	# =============================================================================
	# Maps solution configurations to specific project configurations
	# This tells the build system how to build each project in each configuration
	GlobalSection(ProjectConfigurationPlatforms) = postSolution
		# Debug Configuration:
		# ActiveCfg = Which configuration to use when this project is active
		# Build.0 = Whether to build this project (0 = build, 1 = don't build)
		{A1B2C3D4-E5F6-7890-ABCD-EF1234567890}.Debug|Any CPU.ActiveCfg = Debug|Any CPU
		{A1B2C3D4-E5F6-7890-ABCD-EF1234567890}.Debug|Any CPU.Build.0 = Debug|Any CPU
		
		# Release Configuration:
		# Same as above, but for Release builds
		{A1B2C3D4-E5F6-7890-ABCD-EF1234567890}.Release|Any CPU.ActiveCfg = Release|Any CPU
		{A1B2C3D4-E5F6-7890-ABCD-EF1234567890}.Release|Any CPU.Build.0 = Release|Any CPU
	EndGlobalSection
EndGlobal
